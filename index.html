<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width,
               height=device-height,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

    <title>Unity Web Player | Desafios Do Conhecimento HTML</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7TE7Q2NDCL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-7TE7Q2NDCL');
    </script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('Build/background.png') center center / cover no-repeat;
            touch-action: none;
            overscroll-behavior: none;
        }

        #unity-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        #unity-canvas {
            display: block;
            background: black;
            touch-action: none;
        }
    </style>
</head>

<body>

    <div id="unity-wrapper">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/DesafiosDoConhecimento.loader.js"></script>

    <script>

        const canvas = document.getElementById("unity-canvas");
        const ASPECT = 16 / 9;

        const isMobile =
            /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);

        function fitCanvas() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            if (isMobile) {
                canvas.style.width = vw + "px";
                canvas.style.height = vh + "px";

                canvas.width = vw * window.devicePixelRatio;
                canvas.height = vh * window.devicePixelRatio;
            }
            else {
                let w = vw;
                let h = vw / ASPECT;

                if (h > vh) {
                    h = vh;
                    w = vh * ASPECT;
                }

                canvas.style.width = Math.floor(w) + "px";
                canvas.style.height = Math.floor(h) + "px";
            }
        }

        window.addEventListener("resize", fitCanvas);
        window.addEventListener("orientationchange", () => {
            setTimeout(fitCanvas, 200);
        });

        document.body.addEventListener("touchmove", e => {
            e.preventDefault();
        }, { passive: false });

        fitCanvas();

        createUnityInstance(canvas,
            {
                arguments: [],
                dataUrl: "Build/DesafiosDoConhecimento.data.unityweb",
                frameworkUrl: "Build/DesafiosDoConhecimento.framework.js.unityweb",
                codeUrl: "Build/DesafiosDoConhecimento.wasm.unityweb",

                streamingAssetsUrl: "StreamingAssets",

                companyName: "Sesi-RS",
                productName: "Desafios Do Conhecimento HTML",
                productVersion: "1.0.0",

                matchWebGLToCanvasSize: true,

                devicePixelRatio: isMobile ? window.devicePixelRatio : 1

            }).then((unityInstance) => {

            }).catch((message) => {
                alert(message);
            });

    </script>

</body>
</html>
